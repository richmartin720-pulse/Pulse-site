<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pulse Voice</title>

<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:linear-gradient(180deg,#0f172a,#020617);
color:white;
}
.container{
max-width:800px;
margin:auto;
padding:60px 20px;
}
.logo{
width:80px;
margin-bottom:20px;
}
h1{
font-size:34px;
margin-bottom:10px;
}
p{
color:#cbd5e1;
line-height:1.6;
}
a{
text-decoration:none;
}
.card{
margin-top:30px;
padding:20px;
border:1px solid rgba(255,255,255,0.08);
border-radius:16px;
background:rgba(255,255,255,0.04);
}
.label{
font-size:12px;
letter-spacing:1px;
text-transform:uppercase;
color:#94a3b8;
margin-bottom:8px;
}
.value{
font-size:18px;
color:white;
margin-bottom:18px;
word-break:break-word;
}
.actions{
display:flex;
gap:12px;
flex-wrap:wrap;
margin-top:24px;
}
.button{
display:inline-block;
padding:14px 18px;
border-radius:12px;
font-weight:bold;
font-size:16px;
}
.button-primary{
background:white;
color:#020617;
}
.button-secondary{
background:transparent;
color:#93c5fd;
border:1px solid rgba(147,197,253,0.35);
}
.small{
font-size:14px;
color:#94a3b8;
margin-top:20px;
}
footer{
margin-top:60px;
color:#64748b;
font-size:14px;
}
</style>
</head>

<body>
<div class="container">
  <img src="logo.png" class="logo" alt="Pulse Logo">

  <h1>Pulse Voice</h1>
  <p>Hear the world</p>

  <div class="card">
    <div class="label">Shared Voice ID</div>
    <div id="voiceIdText" class="value">Loading...</div>

    <p>
      This shared Pulse voice can be opened in the app.
    </p>

    <div class="actions">
      <a id="openAppButton" class="button button-primary" href="https://apps.apple.com/">Download Pulse</a>
      <a class="button button-secondary" href="https://apps.apple.com/" target="_blank" rel="noopener noreferrer">Download on the App Store</a>
    </div>

     <p class="small">
      Watch debates and share your voice in Pulse. Download the app from the App Store.
    </p>
  </div>

  <footer>
    <a href="index.html" style="color:#93c5fd;">Back to home</a>
  </footer>
</div>

<script>
function getVideoId() {
  const params = new URLSearchParams(window.location.search);
  return params.get("id");
}

const videoId = getVideoId();
const voiceIdText = document.getElementById("voiceIdText");
const openAppButton = document.getElementById("openAppButton");

if (videoId) {
  voiceIdText.textContent = videoId;
  openAppButton.href = `pulse://voice/${videoId}`;
} else {
  voiceIdText.textContent = "Missing voice id";
  openAppButton.href = "pulse://";
}
</script>

</body>
</html>
