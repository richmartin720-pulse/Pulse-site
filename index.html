<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pulse</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      text-align: center;
      padding: 60px 20px;
    }
    .wrap {
      max-width: 700px;
      margin: 0 auto;
    }
    h1 {
      font-size: 42px;
      margin-bottom: 12px;
    }
    p {
      font-size: 18px;
      line-height: 1.6;
      color: #cbd5e1;
    }
    .btn {
      display: inline-block;
      margin-top: 24px;
      padding: 14px 22px;
      background: #3b82f6;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
    }
    .links {
      margin-top: 40px;
    }
    .links a {
      color: #93c5fd;
      text-decoration: none;
      margin: 0 12px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Pulse</h1>
    <p>The place where the world shares its voice.</p>
    <p>Pulse is a social video app where people respond to big questions with short videos.</p>
    <a class="btn" href="#">Download on the App Store</a>
    <div class="links">
      <a href="/privacy.html">Privacy Policy</a>
      <a href="/support.html">Support</a>
    </div>
  </div>
</body>
</html>
