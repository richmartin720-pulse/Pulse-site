<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse Daily Content</title>

<style>
body {
  margin:0;
  font-family: Arial, sans-serif;
  background:#081226;
  color:white;
  padding:14px;
}

.wrap {
  max-width:900px;
  margin:auto;
}

.hero {
  background:#111b31;
  padding:12px;
  border-radius:14px;
  margin-bottom:10px;
}

.question {
  font-size:17px;
  font-weight:700;
  margin-bottom:8px;
  line-height:1.35;
}

.stats {
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.stat {
  background:#0d1628;
  padding:7px 9px;
  border-radius:9px;
  font-size:12px;
}

.card {
  background:#111b31;
  border:1px solid #24314f;
  border-radius:12px;
  margin-bottom:8px;
  overflow:hidden;
}

.card.persona {
  background:#0f172a;
  border-color:#1f2a44;
}

.card-header {
  width:100%;
  background:transparent;
  color:white;
  border:none;
  padding:10px 12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  cursor:pointer;
  text-align:left;
}

.card-title {
  font-size:15px;
  font-weight:700;
  line-height:1.25;
}

.card-meta {
  font-size:12px;
  color:#9fb0cf;
  margin-top:2px;
}

.arrow {
  font-size:16px;
  color:#9fb0cf;
}

.card-body {
  display:none;
  padding:0 12px 12px;
}

.card.open .card-body {
  display:block;
}

.card.open .arrow {
  transform:rotate(90deg);
}

textarea {
  width:100%;
  min-height:110px;
  background:#0a1222;
  color:white;
  border:1px solid #24314f;
  padding:10px;
  border-radius:8px;
  font-size:13px;
  line-height:1.4;
  box-sizing:border-box;
}

.copy-btn {
  margin:0 12px 10px;
  padding:8px 12px;
  background:#4f46e5;
  border:none;
  border-radius:8px;
  color:white;
  cursor:pointer;
  font-weight:700;
}

.copy-btn.small {
  margin:0;
  padding:7px 10px;
  font-size:12px;
}

.header-actions {
  display:flex;
  align-items:center;
  gap:8px;
  flex-shrink:0;
}

.error {
  color:#ff9b9b;
  font-weight:700;
  white-space:pre-wrap;
}
</style>
</head>

<body>
<div class="wrap">
<div id="app">Loading...</div>
</div>

<script>
const API_URL = "https://nnnmksktrzwuyyvouyxb.supabase.co/functions/v1/daily-prompt?key=pulse-8472-secure";

const flags = [
"🇺🇸","🇦🇺","🇮🇹","🇯🇵","🇨🇴","🇳🇴","🇬🇧","🇮🇳","🇧🇷","🇦🇪","🇩🇪","🇿🇦"
];

const countries = [
"USA",
"Australia",
"Italy",
"Japan",
"Colombia",
"Norway",
"England",
"India",
"Brazil",
"UAE",
"Germany",
"South Africa"
];

const usernames = [
"BuzzBeat - USA",
"Farillo - Aus",
"FozzyW - italy 50",
"Kahate - japan ",
"RichMartin - Colombia",
"rich-martin - Norway",
"rich.martin.720",
"FagoVis686 - india ",
"TIKOJOY533 - Brazil ",
"VAXAB44473 - UAE",
"JAYAFO7829 -Germany",
"MIHOM89785 - South Africa"
];

function escapeHtml(str) {
  return String(str ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#39;");
}

async function copyRaw(text, btn){
  await navigator.clipboard.writeText(text);
  const old = btn.innerText;
  btn.innerText = "Copied";
  setTimeout(()=>btn.innerText = old, 1000);
}

function toggleCard(id){
  document.getElementById(id).classList.toggle("open");
}

function makeCard(id, title, meta, content, extraClass = ""){
  return `
  <div class="card ${extraClass}" id="${id}">
    <div class="card-header" onclick="toggleCard('${id}')">
      <div>
        <div class="card-title">${escapeHtml(title)}</div>
        ${meta ? `<div class="card-meta">${escapeHtml(meta)}</div>` : ""}
      </div>
      <div class="header-actions">
        <button class="copy-btn small" onclick="event.stopPropagation(); copyRaw(document.getElementById('${id}-text').value, this)">Copy</button>
        <span class="arrow">▶</span>
      </div>
    </div>
    <div class="card-body">
      <textarea id="${id}-text">${escapeHtml(content)}</textarea>
    </div>
  </div>`;
}

function promoGeneral(){
return `Create a 9:16 vertical TikTok advert for a mobile app called Pulse.

Pulse is a weekly global opinion app.

CORE MESSAGE:
"1 question. 1 week. 1 world."

The app lets people pick YES or NO and hear what the world thinks.

GOAL:
Make viewers curious enough to search for Pulse, visit the app, download it, sign up, and vote.

STYLE:
- Premium
- Modern
- Dark
- Minimal
- Social-first
- High contrast
- Mobile app advert feel
- Fast TikTok pacing

USE THE UPLOADED PULSE SCREENSHOTS AS VISUAL REFERENCE.

TEXT TO USE:
"1 question"
"1 week"
"1 world"
"YES or NO?"
"Pick a side"
"Pulse"
"Hear the World"

STRUCTURE:
- Start with a clean Pulse app screenshot in the center
- Add quick polished transitions
- Show YES / NO energy around the app
- Show the line "1 question. 1 week. 1 world."
- End with Pulse branding

RULES:
- 9:16 vertical only
- Keep all text centered
- Keep wide safe margins
- No long text
- No clutter
- No tiny unreadable text
- No people speaking
- No fake subtitles
- Make it feel like a real app advert

Length:
6 to 8 seconds`;
}

function promoWeekly(){
return `Make an advert for this app called Pulse that will go on TikTok.

The aim is to get people to go to the app and download it and sign up and vote.

Use any knowledge that you have psychological balance and marketing skills to make the best TikTok video possible for this app using the screenshots as a references`;
}

function enhancePersonaPrompt(original){
return `${original}

LANGUAGE:
- Speak in clear English
- Use a natural accent from their country or nationality
- The accent should add variety but still be easy for a global audience to understand

STYLE:
- Natural speech
- Casual TikTok style
- Short sentences
- Real human tone
- Not robotic

IMPORTANT:
- Must sound like a real person talking to camera
- Keep it believable and relatable`;
}

function adImagePrompt(q){
return `Create a 9:16 vertical poster-style image for a modern social media app called Pulse.

Style:
- Dark background
- Minimal
- Clean UI
- High contrast
- Modern mobile design
- Premium tech feel
- Very readable text
- Built for a small phone screen
- No clutter

Main text:
"${q}"

Secondary text:
"1 question. 1 week."
"Hear the World"

Design:
- Keep the question centered and inside safe margins
- Make the text bold and easy to read on a phone
- Add subtle app-style framing or a clean card
- Include understated Pulse branding
- Make it feel like a premium ad poster for social media

No extra elements.`;
}

function socialCopy(q){
return `${q} 👇

#Pulse #fyp #viral #debate #question`;
}

async function load(){
  const app = document.getElementById("app");

  try {
    const res = await fetch(API_URL, { cache:"no-store" });
    const data = await res.json();

    if (!res.ok || data.error) {
      app.innerHTML = `<div class="error">${escapeHtml(data.error || "Unknown error")}</div>`;
      return;
    }

    let html = `
      <div class="hero">
        <div class="question">${escapeHtml(data.question)}</div>
        <div class="stats">
          <div class="stat">YES ${data.yesPercent}%</div>
          <div class="stat">NO ${data.noPercent}%</div>
          <div class="stat">${data.displayVotes}+ votes</div>
        </div>
      </div>

      ${makeCard("promoGeneral", "Promo General", "General Pulse advert", promoGeneral())}
      ${makeCard("promoWeekly", "Promo Weekly", "Best performing Grok advert prompt", promoWeekly())}
      ${makeCard("adImage", "Ad Image Prompt", "Poster/image prompt", adImagePrompt(data.question || ""))}
      ${makeCard("socialCopy", "Social Copy", "Caption + 5 hashtags", socialCopy(data.question || ""))}
    `;

    (data.personaPrompts || []).forEach((p, i) => {
      const title = `Persona ${i + 1} — ${usernames[i] || p.name || ""}`;
      const meta = `${countries[i] || p.country || ""} ${flags[i] || ""}`;
      html += makeCard(
        `persona${i}`,
        title,
        meta,
        enhancePersonaPrompt(p.prompt || ""),
        "persona"
      );
    });

    app.innerHTML = html;
  } catch (err) {
    app.innerHTML = `<div class="error">${escapeHtml(String(err))}</div>`;
  }
}

load();
</script>
</body>
</html>
