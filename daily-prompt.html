<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pulse Daily Prompt</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
      margin: 0;
      padding: 20px;
    }
    .wrap {
      max-width: 960px;
      margin: 0 auto;
    }
    .hero, .box {
      background: #121826;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
    }
    h1, h2 {
      margin: 0 0 10px;
    }
    .question {
      font-size: 20px;
      line-height: 1.4;
      margin-bottom: 12px;
    }
    .stats {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .stat {
      background: #0f172a;
      padding: 12px 14px;
      border-radius: 10px;
      min-width: 120px;
    }
    textarea {
      width: 100%;
      min-height: 120px;
      background: #0b1020;
      color: white;
      border: 1px solid #27324a;
      padding: 10px;
      border-radius: 8px;
      box-sizing: border-box;
      resize: vertical;
    }
    button {
      margin-top: 10px;
      margin-right: 8px;
      padding: 9px 12px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .small {
      color: #b7c0d6;
      font-size: 13px;
      margin-bottom: 8px;
    }
    .error {
      color: #ff8f8f;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="app" class="box">Loading...</div>
  </div>

  <script>
    const API_URL = "https://nnnmksktrzwuyyvouyxb.supabase.co/functions/v1/daily-prompt?key=pulse-8472-secure";

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    async function copyText(id, btn) {
      const el = document.getElementById(id);
      await navigator.clipboard.writeText(el.value);
      const old = btn.textContent;
      btn.textContent = "Copied";
      setTimeout(() => btn.textContent = old, 1200);
    }

    async function load() {
      const app = document.getElementById("app");

      try {
        const res = await fetch(API_URL, { cache: "no-store" });
        const data = await res.json();

        if (!res.ok || data.error) {
          app.innerHTML = `<div class="error">${escapeHtml(data.error || "Unknown error")}</div>`;
          return;
        }

        app.outerHTML = `
          <div class="hero">
            <h1>Pulse Daily Content</h1>
            <div class="question">${escapeHtml(data.question)}</div>
            <div class="stats">
              <div class="stat">YES ${data.yesPercent}%</div>
              <div class="stat">NO ${data.noPercent}%</div>
              <div class="stat">${data.displayVotes}+ votes</div>
            </div>
          </div>

          <div class="box">
            <h2>Gemini Prompt A</h2>
            <div class="small">Results-led version</div>
            <textarea id="a">${escapeHtml(data.promptA)}</textarea>
            <button onclick="copyText('a', this)">Copy Prompt A</button>
          </div>

          <div class="box">
            <h2>Gemini Prompt B</h2>
            <div class="small">Hook-led version</div>
            <textarea id="b">${escapeHtml(data.promptB)}</textarea>
            <button onclick="copyText('b', this)">Copy Prompt B</button>
          </div>

          <div class="box">
            <h2>TikTok</h2>
            <div class="small">Caption</div>
            <textarea id="t1">${escapeHtml(data.tiktokCaption)}</textarea>
            <button onclick="copyText('t1', this)">Copy TikTok Caption</button>
            <div class="small" style="margin-top:10px;">Hashtags</div>
            <textarea id="t2">${escapeHtml(data.tiktokTags)}</textarea>
            <button onclick="copyText('t2', this)">Copy TikTok Hashtags</button>
          </div>

          <div class="box">
            <h2>Instagram Reels</h2>
            <div class="small">Caption</div>
            <textarea id="i1">${escapeHtml(data.instaCaption)}</textarea>
            <button onclick="copyText('i1', this)">Copy Instagram Caption</button>
            <div class="small" style="margin-top:10px;">Hashtags</div>
            <textarea id="i2">${escapeHtml(data.instaTags)}</textarea>
            <button onclick="copyText('i2', this)">Copy Instagram Hashtags</button>
          </div>

          <div class="box">
            <h2>YouTube Shorts</h2>
            <div class="small">Title</div>
            <textarea id="y1">${escapeHtml(data.ytTitle)}</textarea>
            <button onclick="copyText('y1', this)">Copy YouTube Title</button>
            <div class="small" style="margin-top:10px;">Caption</div>
            <textarea id="y2">${escapeHtml(data.ytCaption)}</textarea>
            <button onclick="copyText('y2', this)">Copy YouTube Caption</button>
            <div class="small" style="margin-top:10px;">Hashtags</div>
            <textarea id="y3">${escapeHtml(data.ytTags)}</textarea>
            <button onclick="copyText('y3', this)">Copy YouTube Hashtags</button>
          </div>
        `;
      } catch (err) {
        app.innerHTML = `<div class="error">${escapeHtml(String(err))}</div>`;
      }
    }

    load();
  </script>
</body>
</html>
