<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse Daily Content</title>

<style>
body {
  margin:0;
  font-family: Arial, sans-serif;
  background:#081226;
  color:white;
  padding:14px;
}

.wrap {
  max-width:900px;
  margin:auto;
}

/* HERO */
.hero {
  background:#111b31;
  padding:12px;
  border-radius:14px;
  margin-bottom:10px;
}

.question {
  font-size:17px;
  font-weight:700;
  margin-bottom:8px;
}

.stats {
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.stat {
  background:#0d1628;
  padding:7px 9px;
  border-radius:9px;
  font-size:12px;
}

/* CARD */
.card {
  background:#111b31;
  border:1px solid #24314f;
  border-radius:12px;
  margin-bottom:8px;
}

.card.persona {
  background:#0f172a;
  border-color:#1f2a44;
}

/* HEADER */
.card-header {
  padding:10px 14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.card-text {
  flex:1;
}

.card-title {
  font-size:15px;
  font-weight:700;
}

.card-meta {
  font-size:12px;
  color:#9fb0cf;
}

/* ACTIONS */
.actions {
  display:flex;
  gap:6px;
  padding-right:10px; /* 👈 pushes away from edge */
}

button {
  padding:6px 10px;
  font-size:12px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.copy {
  background:#4f46e5;
  color:white;
}

.view {
  background:#1f2a44;
  color:white;
}

/* BODY */
.card-body {
  display:none;
  padding:10px 14px;
}

.card.open .card-body {
  display:block;
}

textarea {
  width:100%;
  min-height:100px;
  background:#0a1222;
  color:white;
  border:1px solid #24314f;
  padding:10px;
  border-radius:8px;
  font-size:13px;
}

/* MOBILE FIX */
@media (max-width: 480px) {
  .card-header {
    flex-direction:column;
    align-items:flex-start;
  }

  .actions {
    padding-right:0;
    margin-top:6px;
  }
}
</style>
</head>

<body>
<div class="wrap">
<div id="app">Loading...</div>
</div>

<script>

const API_URL = "https://nnnmksktrzwuyyvouyxb.supabase.co/functions/v1/daily-prompt?key=pulse-8472-secure";

const flags = ["🇺🇸","🇦🇺","🇮🇹","🇯🇵","🇨🇴","🇳🇴","🇬🇧","🇮🇳","🇧🇷","🇦🇪","🇩🇪","🇿🇦"];

const countries = ["USA","Australia","Italy","Japan","Colombia","Norway","England","India","Brazil","UAE","Germany","South Africa"];

const usernames = [
"BuzzBeat","Farillo","FozzyW","Kahate","RichMartinColombia",
"rich-martin","rich.martin.720","FagoVis686",
"TIKOJOY533","VAXAB44473","JAYAFO7829","MIHOM89785"
];

function copy(text, btn){
navigator.clipboard.writeText(text);
btn.innerText="Copied";
setTimeout(()=>btn.innerText="Copy",1000);
}

function toggle(el){
el.closest(".card").classList.toggle("open");
}

function makeCard(title, meta, content, persona=false){

return `
<div class="card ${persona ? "persona":""}">
  <div class="card-header">
    
    <div class="card-text">
      <div class="card-title">${title}</div>
      <div class="card-meta">${meta || ""}</div>
    </div>

    <div class="actions">
      <button class="copy" onclick="copy(this.dataset.text,this)" data-text="${encodeURIComponent(content)}">Copy</button>
      <button class="view" onclick="toggle(this)">View</button>
    </div>

  </div>

  <div class="card-body">
    <textarea>${content}</textarea>
  </div>
</div>
`;
}

function promoGeneral(){
return `Create a 9:16 vertical TikTok advert for Pulse.

Core idea:
"1 question. 1 week. 1 world."

Make it premium, modern, dark, minimal.

Goal:
Make people curious enough to search Pulse and download.

Use:
- app screenshots
- YES / NO tension
- short text only

End with:
"Pulse — Hear the World"

6–8 seconds only.`;
}

function promoWeekly(){
return `Make an advert for this app called Pulse that will go on TikTok.

The aim is to get people to go to the app and download it and sign up and vote.

Use any knowledge that you have psychological balance and marketing skills to make the best TikTok video possible for this app using the screenshots as a references`;
}

function enhance(p){
return `${p}

Speak in English with a natural local accent.
Keep it short, casual, and human.
`;
}

function social(q){
return `${q} 👇

#Pulse #fyp #viral #debate #question`;
}

async function load(){

const res = await fetch(API_URL);
const data = await res.json();

let html = `
<div class="hero">
<div class="question">${data.question}</div>
<div class="stats">
<div class="stat">YES ${data.yesPercent}%</div>
<div class="stat">NO ${data.noPercent}%</div>
<div class="stat">${data.displayVotes}+ votes</div>
</div>
</div>

${makeCard("Promo General","General app advert",promoGeneral())}
${makeCard("Promo Weekly","Best performing Grok prompt",promoWeekly())}
${makeCard("Ad Image","Poster prompt",data.imagePrompt1 || "")}
${makeCard("Social Copy","Caption + hashtags",social(data.question))}
`;

(data.personaPrompts || []).forEach((p,i)=>{
html += makeCard(
`Persona ${i+1} — ${usernames[i]}`,
`${countries[i]} ${flags[i]}`,
enhance(p.prompt),
true
);
});

document.getElementById("app").innerHTML = html;

}

load();
</script>
</body>
</html>
