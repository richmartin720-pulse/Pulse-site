<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse Daily Content</title>

<style>
body {
  margin:0;
  font-family: Arial, sans-serif;
  background:#081226;
  color:white;
  padding:14px;
}

.wrap {
  max-width:900px;
  margin:auto;
}

.hero {
  background:#111b31;
  padding:14px;
  border-radius:14px;
  margin-bottom:12px;
}

.question {
  font-size:18px;
  font-weight:700;
  margin-bottom:10px;
}

.stats {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.stat {
  background:#0d1628;
  padding:8px 10px;
  border-radius:10px;
  font-size:13px;
}

.box {
  background:#111b31;
  padding:14px;
  border-radius:14px;
  margin-bottom:12px;
}

h2 {
  margin:0 0 6px;
  font-size:17px;
}

textarea {
  width:100%;
  min-height:120px;
  background:#0a1222;
  color:white;
  border:1px solid #24314f;
  padding:10px;
  border-radius:8px;
  font-size:13px;
  line-height:1.4;
}

textarea.short {
  min-height:90px;
}

button {
  margin-top:8px;
  padding:8px 12px;
  background:#4f46e5;
  border:none;
  border-radius:8px;
  color:white;
  cursor:pointer;
}

.persona {
  background:#0f172a;
  border:1px solid #1f2a44;
  padding:12px;
  border-radius:12px;
  margin-bottom:10px;
}

.persona textarea {
  min-height:100px;
}

.username {
  font-size:12px;
  color:#9fb0cf;
}
</style>
</head>

<body>
<div class="wrap">
<div id="app">Loading...</div>
</div>

<script>

const API_URL = "https://nnnmksktrzwuyyvouyxb.supabase.co/functions/v1/daily-prompt?key=pulse-8472-secure";

const flags = [
"🇺🇸","🇦🇺","🇮🇹","🇯🇵","🇨🇴","🇳🇴","🇬🇧","🇮🇳","🇧🇷","🇦🇪","🇩🇪","🇿🇦"
];

const usernames = [
"BuzzBeat",
"Farillo",
"FozzyW",
"Kahate",
"RichMartinColombia",
"RichMartinNorway",
"rich.martin.720",
"FagoVis686",
"TIKOJOY533",
"VAXAB44473",
"JAYAFO7829",
"MIHOM89785"
];

function copyText(id, btn){
  const el = document.getElementById(id);
  navigator.clipboard.writeText(el.value);
  btn.innerText="Copied";
  setTimeout(()=>btn.innerText="Copy",1000);
}

function promoGeneral(){
return `Create a 9:16 vertical TikTok advert for a mobile app called Pulse.

Pulse is a weekly global opinion app.

CORE MESSAGE:
"1 question. 1 week. 1 world."

The app lets people pick YES or NO and hear what the world thinks.

GOAL:
Make viewers curious enough to search for Pulse, visit the app, download it, sign up, and vote.

STYLE:
- Premium
- Modern
- Dark
- Minimal
- Social-first
- High contrast
- Mobile app advert feel
- Fast TikTok pacing

USE THE UPLOADED PULSE SCREENSHOTS AS VISUAL REFERENCE.

TEXT TO USE:
"1 question"
"1 week"
"1 world"
"YES or NO?"
"Pick a side"
"Pulse"
"Hear the World"

STRUCTURE:
- Start with a clean Pulse app screenshot in the center
- Add quick polished transitions
- Show YES / NO energy around the app
- Show the line "1 question. 1 week. 1 world."
- End with Pulse branding

RULES:
- 9:16 vertical only
- Keep all text centered
- Keep wide safe margins
- No long text
- No clutter
- No tiny unreadable text
- No people speaking
- No fake subtitles
- Make it feel like a real app advert

Length:
6 to 8 seconds`;
}

function promoWeekly(){
return `Make an advert for this app called Pulse that will go on TikTok.

The aim is to get people to go to the app and download it and sign up and vote.

Use any knowledge that you have psychological balance and marketing skills to make the best TikTok video possible for this app using the screenshots as a references`;
}

function socialCopy(q){
return `${q} 👇

#Pulse #fyp #viral #debate #question`;
}

async function load(){

const res = await fetch(API_URL);
const data = await res.json();

let personaHTML = "";

(data.personaPrompts || []).forEach((p,i)=>{
personaHTML += `
<div class="persona">
<h2>Persona ${i+1} ${flags[i] || ""}</h2>
<div class="username">${usernames[i] || ""}</div>
<textarea id="p${i}">${p.prompt}</textarea>
<button onclick="copyText('p${i}',this)">Copy</button>
</div>
`;
});

document.getElementById("app").innerHTML = `

<div class="hero">
<div class="question">${data.question}</div>

<div class="stats">
<div class="stat">YES ${data.yesPercent}%</div>
<div class="stat">NO ${data.noPercent}%</div>
<div class="stat">${data.displayVotes}+ votes</div>
</div>
</div>

<div class="box">
<h2>Promo General</h2>
<textarea id="promoGeneral">${promoGeneral()}</textarea>
<button onclick="copyText('promoGeneral',this)">Copy</button>
</div>

<div class="box">
<h2>Promo Weekly</h2>
<textarea id="promoWeekly">${promoWeekly()}</textarea>
<button onclick="copyText('promoWeekly',this)">Copy</button>
</div>

<div class="box">
<h2>Ad Image Prompt</h2>
<textarea id="img">${data.imagePrompt1 || ""}</textarea>
<button onclick="copyText('img',this)">Copy</button>
</div>

<div class="box">
<h2>Social Copy</h2>
<textarea id="social" class="short">${socialCopy(data.question)}</textarea>
<button onclick="copyText('social',this)">Copy</button>
</div>

${personaHTML}

`;
}

load();

</script>
</body>
</html>
